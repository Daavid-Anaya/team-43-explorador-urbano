schema: spec-driven

context: |
  Proyecto: team-43-explorador-urbano
  Stack: Vite 8 + React 19 + TypeScript 6 (npm)
  Arquitectura: app shell solo de frontend en src/app con flujo SDD/OpenSpec-first
  Testing: Vitest 4 + React Testing Library + jsdom; TDD estricto habilitado
  Calidad: oxlint, tsc -b, CI de GitHub Actions en Node 22
  Colaboración: GitHub Flow, Conventional Commits, presupuesto de review de ~400 líneas
  Persistencia: híbrida (OpenSpec + Engram)
  Decisión de plataforma: Supabase + Vercel reemplaza el plan previo de AWS/Amplify; la implementación debe mantener el progreso/recompensas derivados del servidor/DB y mantener la service role de Supabase fuera del código del cliente.

strict_tdd: true

testing:
  strict_tdd: true
  detected: 2026-07-23
  runner:
    framework: vitest
    command: npm run test
  layers:
    unit:
      available: true
      tool: Vitest
    integration:
      available: true
      tool: React Testing Library + jsdom
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
  quality:
    linter:
      available: true
      command: npm run lint
    type_checker:
      available: true
      command: npm run typecheck
    formatter:
      available: false
      command: "—"

rules:
  proposal:
    - Escribir artefactos en español.
    - Indicar el impacto en el trabajo paralelo entre 3 desarrolladores.
    - Incluir plan de rollback para cambios riesgosos.
  specs:
    - Escribir artefactos en español.
    - Usar DADO/CUANDO/ENTONCES para los escenarios.
    - Usar palabras clave RFC 2119 en español (DEBE, DEBERÍA, PUEDE).
  design:
    - Escribir artefactos en español.
    - Documentar las decisiones de arquitectura y los límites de responsabilidad del equipo.
  tasks:
    - Escribir artefactos en español.
    - Agrupar el trabajo para delegación entre 3 desarrolladores.
    - Mantener las tareas revisables de forma independiente dentro de ~400 líneas modificadas cuando sea posible.
  apply:
    guidelines:
      - La implementación es opt-in más adelante; el flujo por defecto se detiene en la delegación de tareas.
      - Seguir los patrones existentes del proyecto una vez que exista código fuente.
    tdd: true
    test_command: npm run test
  verify:
    test_command: npm run test
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Preservar el historial de cambios completados en openspec/changes/archive.
